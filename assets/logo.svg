<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 64" fill="none">
  <defs>
    <linearGradient id="phDiamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="phGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Diamond Logo Mark -->
  <g transform="translate(4, 4)" filter="url(#phGlow)">
    <!-- Rotated rounded rectangle -->
    <rect x="10" y="10" width="36" height="36" rx="9" transform="rotate(45 28 28)" fill="url(#phDiamondGrad)"/>
    
    <!-- Stylized 'P' inside diamond -->
    <path d="M 23 18 L 30 18 C 34.5 18 37.5 21 37.5 25 C 37.5 29 34.5 32 30 32 L 27.5 32 L 27.5 38 L 23 38 Z" fill="#ffffff"/>
    <path d="M 27.5 22.2 L 29.8 22.2 C 31.8 22.2 33 23.2 33 25 C 33 26.8 31.8 27.8 29.8 27.8 L 27.5 27.8 Z" fill="url(#phDiamondGrad)"/>
  </g>

  <!-- Text Section -->
  <g transform="translate(68, 14)">
    <!-- Brand Name -->
    <text x="0" y="22" font-family="'Manrope', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="20" letter-spacing="-0.02em" fill="#0f172a">
      Phonix<tspan dx="5" font-weight="700" fill="#2563eb">IT Solutions</tspan>
    </text>
    <!-- Tagline -->
    <text x="1" y="37" font-family="'Inter', sans-serif" font-weight="700" font-size="7.5" letter-spacing="0.14em" fill="#64748b">
      BUILDING SOLUTIONS. DRIVING GROWTH.
    </text>
  </g>
</svg>
