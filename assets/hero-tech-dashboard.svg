<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" fill="none">
  <defs>
    <linearGradient id="dbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Outer Window Frame -->
  <rect x="20" y="20" width="640" height="400" rx="16" fill="url(#dbBg)" stroke="#334155" stroke-width="1.5" filter="url(#softShadow)"/>

  <!-- Window Header -->
  <rect x="20" y="20" width="640" height="42" rx="16" fill="#1e293b"/>
  <rect x="20" y="48" width="640" height="14" fill="#1e293b"/>
  <line x1="20" y1="62" x2="660" y2="62" stroke="#334155" stroke-width="1"/>
  
  <circle cx="44" cy="41" r="5" fill="#ef4444"/>
  <circle cx="60" cy="41" r="5" fill="#f59e0b"/>
  <circle cx="76" cy="41" r="5" fill="#10b981"/>

  <rect x="180" y="32" width="320" height="18" rx="9" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="270" y="45" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94a3b8">app.phonixitsolutions.com</text>

  <!-- Left Sidebar -->
  <rect x="20" y="63" width="130" height="357" fill="#0b1329"/>
  <line x1="150" y1="63" x2="150" y2="420" stroke="#334155" stroke-width="1"/>

  <!-- Sidebar Nav Items -->
  <rect x="32" y="80" width="106" height="26" rx="6" fill="#1e293b"/>
  <rect x="42" y="89" width="8" height="8" rx="2" fill="#38bdf8"/>
  <rect x="56" y="90" width="55" height="6" rx="3" fill="#ffffff"/>

  <rect x="42" y="121" width="8" height="8" rx="2" fill="#64748b"/>
  <rect x="56" y="122" width="65" height="6" rx="3" fill="#64748b"/>

  <rect x="42" y="153" width="8" height="8" rx="2" fill="#64748b"/>
  <rect x="56" y="154" width="45" height="6" rx="3" fill="#64748b"/>

  <rect x="42" y="185" width="8" height="8" rx="2" fill="#64748b"/>
  <rect x="56" y="186" width="60" height="6" rx="3" fill="#64748b"/>

  <!-- Main Content Area -->
  <!-- Top Stat Cards -->
  <g transform="translate(170, 80)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="150" height="74" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="16" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#94a3b8">SYSTEM STATUS</text>
    <text x="16" y="48" font-family="'Manrope', sans-serif" font-size="18" font-weight="900" fill="#34d399">99.98%</text>
    <text x="16" y="62" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#64748b">Active &amp; Scalable</text>

    <!-- Card 2 -->
    <rect x="162" y="0" width="150" height="74" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="178" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#94a3b8">API LATENCY</text>
    <text x="178" y="48" font-family="'Manrope', sans-serif" font-size="18" font-weight="900" fill="#38bdf8">18ms</text>
    <text x="178" y="62" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#64748b">Sub-second Speed</text>

    <!-- Card 3 -->
    <rect x="324" y="0" width="150" height="74" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="340" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#94a3b8">CODE SECURITY</text>
    <text x="340" y="48" font-family="'Manrope', sans-serif" font-size="18" font-weight="900" fill="#818cf8">Grade A+</text>
    <text x="340" y="62" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#64748b">Zero Vulnerabilities</text>
  </g>

  <!-- Large Chart Area -->
  <g transform="translate(170, 170)">
    <rect x="0" y="0" width="474" height="230" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    
    <text x="20" y="28" font-family="'Manrope', sans-serif" font-size="13" font-weight="800" fill="#ffffff">Scalable User Throughput &amp; Cloud Performance</text>
    <text x="20" y="44" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Real-time architecture performance tracking</text>

    <!-- Grid Lines -->
    <line x1="20" y1="75" x2="454" y2="75" stroke="#334155" stroke-dasharray="3 3"/>
    <line x1="20" y1="120" x2="454" y2="120" stroke="#334155" stroke-dasharray="3 3"/>
    <line x1="20" y1="165" x2="454" y2="165" stroke="#334155" stroke-dasharray="3 3"/>

    <!-- Area Gradient Chart -->
    <path d="M 20 180 Q 80 160 140 140 T 260 110 T 360 85 T 454 65 L 454 200 L 20 200 Z" fill="url(#cyanBlueGrad)" opacity="0.15"/>
    <path d="M 20 180 Q 80 160 140 140 T 260 110 T 360 85 T 454 65" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Data Nodes -->
    <circle cx="140" cy="140" r="5" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
    <circle cx="260" cy="110" r="5" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
    <circle cx="360" cy="85" r="5" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
    <circle cx="454" cy="65" r="6" fill="#34d399" stroke="#0f172a" stroke-width="2"/>

    <rect x="390" y="95" width="55" height="20" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
    <text x="398" y="109" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#34d399">+340% Peak</text>
  </g>
