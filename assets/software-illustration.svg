<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="softBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="primaryBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Background Base Container -->
  <rect x="20" y="20" width="560" height="360" rx="16" fill="url(#softBlueGrad)" stroke="#bfdbfe" stroke-width="1.5"/>

  <!-- Server & Cloud Layer -->
  <g transform="translate(60, 60)">
    <!-- Main Application Window -->
    <rect x="0" y="0" width="340" height="220" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="drop-shadow(0 10px 15px rgba(15,23,42,0.08))"/>
    
    <!-- Top Bar -->
    <rect x="0" y="0" width="340" height="32" rx="10" fill="#f8fafc"/>
    <line x1="0" y1="32" x2="340" y2="32" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="4" fill="#ef4444"/>
    <circle cx="28" cy="16" r="4" fill="#f59e0b"/>
    <circle cx="40" cy="16" r="4" fill="#10b981"/>
    <rect x="60" y="10" width="160" height="12" rx="6" fill="#e2e8f0"/>

    <!-- Inner UI Elements -->
    <rect x="20" y="50" width="80" height="65" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <rect x="28" y="60" width="40" height="6" rx="3" fill="#3b82f6"/>
    <rect x="28" y="72" width="60" height="4" rx="2" fill="#94a3b8"/>
    <rect x="28" y="80" width="50" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="28" y="92" width="30" height="14" rx="4" fill="#2563eb"/>

    <rect x="115" y="50" width="205" height="65" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Analytics Chart Line -->
    <path d="M 130 95 L 160 80 L 190 88 L 230 68 L 270 75 L 300 62" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="300" cy="62" r="4" fill="#2563eb"/>

    <!-- Bottom Data Grid -->
    <rect x="20" y="130" width="300" height="70" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="20" y1="152" x2="320" y2="152" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="20" y1="174" x2="320" y2="174" stroke="#f1f5f9" stroke-width="1"/>
    <rect x="32" y="138" width="40" height="6" rx="3" fill="#64748b"/>
    <rect x="120" y="138" width="50" height="6" rx="3" fill="#64748b"/>
    <rect x="220" y="138" width="40" height="6" rx="3" fill="#64748b"/>
  </g>

  <!-- Mobile Device Floating -->
  <g transform="translate(390, 110)">
    <rect x="0" y="0" width="130" height="220" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="drop-shadow(0 15px 25px rgba(15,23,42,0.12))"/>
    <rect x="40" y="8" width="50" height="6" rx="3" fill="#cbd5e1"/>
    
    <!-- Mobile App Content -->
    <rect x="12" y="24" width="106" height="40" rx="8" fill="url(#primaryBlueGrad)"/>
    <rect x="20" y="34" width="45" height="6" rx="3" fill="#ffffff"/>
    <rect x="20" y="44" width="70" height="4" rx="2" fill="#bfdbfe"/>

    <rect x="12" y="74" width="106" height="35" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="26" cy="91" r="7" fill="#dbeafe"/>
    <rect x="40" y="86" width="55" height="5" rx="2.5" fill="#475569"/>
    <rect x="40" y="94" width="35" height="4" rx="2" fill="#94a3b8"/>

    <rect x="12" y="118" width="106" height="35" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="26" cy="135" r="7" fill="#dcfce7"/>
    <rect x="40" y="130" width="55" height="5" rx="2.5" fill="#475569"/>
    <rect x="40" y="138" width="45" height="4" rx="2" fill="#94a3b8"/>

    <rect x="12" y="162" width="106" height="40" rx="8" fill="#2563eb"/>
    <rect x="35" y="177" width="60" height="8" rx="4" fill="#ffffff"/>
  </g>
</svg>
